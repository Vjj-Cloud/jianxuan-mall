server:
  port: 8080

spring:
  application:
    name: jianxuan-mall
  # 默认激活 local。真实的口令/密钥放在 application-local.yml，该文件已被 .gitignore 排除。
  # 新环境克隆后，按 application-local.yml.example 复制一份填好即可启动。
  # 用 ${SPRING_PROFILES_ACTIVE:local} 而不是写死 local，是为了部署时能用环境变量改成 prod。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${DB_URL:jdbc:mysql://localhost:3306/jianxuan_mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}"
    username: ${DB_USERNAME:mall}
    # 故意不给默认值。以前这里写着明文口令，注释写着「别提交到仓库」，
    # 但注释拦不住 git——文件本身照样被提交了。
    # 现在缺配置会在启动时直接报 Could not resolve placeholder 'DB_PASSWORD'，
    # 让「没配对」立刻暴露，而不是带着一个默认弱口令静默跑起来。
    password: ${DB_PASSWORD}
    hikari:
      # 默认 10。压测发现下单接口在 16 并发时 138 req/s，加到 32 并发只有 147 req/s
      # 且延迟翻倍——说明请求在排队等连接，不是在算。调到 20 后复测见 docs/压测报告.md。
      # 上线时这个值要按「DB 最大连接数 ÷ 实例数」来定，不是越大越好：
      # 连接数超过 CPU 核数 × 2 之后，上下文切换反而会拖慢整体吞吐。
      maximum-pool-size: 20
      connection-timeout: 3000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # Redis：订单超时取消的延迟队列。
  # Spring Boot 3.x 的前缀是 spring.data.redis，不是 2.x 时代的 spring.redis——
  # 写成旧前缀不会报错，只会静默走 localhost 默认值，很难查。
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      # 默认连 db 0。以后做商品缓存也放这里，key 用前缀区分即可。
      database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 不要用 StdOutImpl：它把每条 SQL 直接 System.out.println，压测时控制台同步 IO
    # 会变成真正的瓶颈（实测下单 112ms/请求，换成 Slf4jImpl 后见 docs/压测报告.md）。
    # Slf4jImpl 走日志框架，级别可控：平时 info 不打 SQL，要排查时改下面的 debug。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  # HS256 要求密钥至少 32 字节。真实值放 application-local.yml（不进仓库），
  # 生产环境通过环境变量 JWT_SECRET 注入。同样不给默认值。
  secret: ${JWT_SECRET}
  # token 有效期（小时）
  expire-hours: 24

# 订单相关
order:
  # 未支付订单的超时时间（分钟）。
  # 用 double 而不是 int，是为了测试时能写成 0.2（12 秒），不必真等半小时。
  # 不改文件也可以临时覆盖：mvn spring-boot:run -Dspring-boot.run.arguments=--order.timeout-minutes=0.2
  timeout-minutes: 30

# 接口文档：springdoc + Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # 按 HTTP 方法分组排序，比默认的字母序更接近阅读习惯
    operations-sorter: method
    tags-sorter: alpha

# 想看 SQL 时把 mapper 包改成 debug，会打印 PreparedStatement 和参数
logging:
  level:
    com.jack.jianxuan.mapper: info
